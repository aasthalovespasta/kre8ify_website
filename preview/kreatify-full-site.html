 {\n    const stepIO = new IntersectionObserver((entries) => entries.forEach((entry) => {\n      if (entry.isIntersecting) entry.target.classList.add('is-on');\n    }), { rootMargin: '0px 0px -45% 0px' });\n    steps.forEach((s) => stepIO.observe(s));\n  }\n\n  /* Tools filter (GTM engineering page) ------------------------------------ */\n  const filters = $$('[data-filter]');\n  filters.forEach((btn) => btn.addEventListener('click', () => {\n    const group = btn.dataset.filter;\n    filters.forEach((b) => { const on = b === btn; b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', String(on)); });\n    $$('[data-tools] .tool').forEach((t) => t.classList.toggle('is-dim', group !== 'all' && t.dataset.group !== group));\n  }));\n\n  /* One lead through the system: steps light up in turn while visible ------- */\n  const flow = $('[data-flow]');\n  if (flow) {\n    const items = $$('.flow__track li', flow);\n    let index = -1, timer = null;\n    const show = (k) => items.forEach((li, j) => { li.classList.toggle('is-on', j <= k); li.classList.toggle('is-now', j === k); });\n    const next = () => { index = (index + 1) % items.length; show(index); timer = setTimeout(next, index === items.length - 1 ? 2800 : 1300); };\n    if (reduceMotion) show(items.length - 1);\n    else new IntersectionObserver(([entry]) => {\n      if (entry.isIntersecting && !timer) next();\n      if (!entry.isIntersecting) { clearTimeout(timer); timer = null; }\n    }, { threshold: 0.4 }).observe(flow);\n  }\n\n  /* Booking form: checks the fields, then opens WhatsApp with the answers --- */\n  const form = $('[data-form]');\n  if (form) {\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      let firstBad = null;\n      [['#f-name', '#e-name'], ['#f-co', '#e-co']].forEach(([input, error]) => {\n        const field = $(input, form), bad = !field.value.trim();\n        field.setAttribute('aria-invalid', String(bad));\n        $(error, form).hidden = !bad;\n        if (bad && !firstBad) firstBad = field;\n      });\n      if (firstBad) { firstBad.focus(); return; }\n      const data = new FormData(form);\n      const message = [\n        \"Hi Krish, I'd like to book a call.\",\n        `Name: ${data.get('name').trim()}`,\n        `Business: ${data.get('company').trim()}`,\n        `Stage: ${data.get('stage')}`,\n        `Looking for: ${data.get('service')}`,\n      ].join('\\n');\n      window.open(`https://wa.me/${form.dataset.wa}?text=${encodeURIComponent(message)}`, '_blank', 'noopener');\n    });\n  }\n})();\n<\/script><script>(function(){var P=[\"index.html\", \"personal-branding.html\", \"business-development.html\", \"gtm-engineering.html\", \"social-media.html\", \"influencer-marketing.html\"];\ndocument.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;\nvar h=a.getAttribute('href'),i=h.indexOf('#'),f=i<0?h:h.slice(0,i),hash=i<0?'':h.slice(i);\nif(P.indexOf(f)<0)return;e.preventDefault();parent.postMessage({kGo:f,hash:hash},'*');},true);\naddEventListener('load',function(){if(window.__H){var el=document.querySelector(window.__H);if(el)setTimeout(function(){el.scrollIntoView();},200);}});})();<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="gtm-engineering.html">"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>GTM engineering for founders | Kreatify<\/title>\n<meta name=\"description\" content=\"GTM engineering is the system behind your sales conversations. We find the companies most likely to buy, reach them at the right moment and put meetings on your calendar.\">\n<meta property=\"og:title\" content=\"GTM engineering for founders | Kreatify\">\n<meta property=\"og:description\" content=\"GTM engineering is the system behind your sales conversations. We find the companies most likely to buy, reach them at the right moment and put meetings on your calendar.\">\n<meta property=\"og:type\" content=\"website\">\n<meta name=\"theme-color\" content=\"#021526\">\n<link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0iIzAyMTUyNiIvPjx0ZXh0IHg9IjciIHk9IjIzIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjcwMCIgZm9udC1zaXplPSIxOSIgZmlsbD0iI2YyZjFlNCI+SzwvdGV4dD48Y2lyY2xlIGN4PSIyNCIgY3k9IjIxIiByPSIyLjYiIGZpbGw9IiM2ZWFjZGEiLz48L3N2Zz4K\" type=\"image/svg+xml\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300..400&display=swap\">\n<style>/* =====================================================================\n   Kreatify site styles\n   1. Tokens        6. Problem        11. Founder\n   2. Base          7. Services       12. FAQ + booking\n   3. Type/buttons  8. Process        13. Footer\n   4. Nav           9. Work           14. Service pages\n   5. Hero         10. Testimonials   15. Motion + responsive\n   Colours only come from the tokens below. Change a token, the whole site follows.\n   ===================================================================== */\n\n/* 1. Tokens ----------------------------------------------------------- */\n:root {\n  --midnight: #021526;\n  --navy: #0a2744;\n  --navy-deep: #031b31;\n  --royal: #03346e;\n  --sky: #6eacda;\n  --sky-light: #e4eef6;\n  --cream: #e2e2b6;\n  --paper: #f2f1e4;\n  --white: #ffffff;\n  --mist: #b6c5d6;\n  --ink-soft: #3a5f86;\n\n  --font: \"Archivo\", system-ui, sans-serif;\n  --serif: \"Fraunces\", Georgia, serif;\n\n  --wrap: min(100% - 40px, 1200px);\n  --radius: 24px;\n  --ease: cubic-bezier(.16, 1, .3, 1);\n  --line-dark: rgb(110 172 218 / .16);\n  --line-light: rgb(3 52 110 / .12);\n  --shadow: 0 24px 60px -30px rgb(2 21 38 / .45);\n}\n\n/* 2. Base ------------------------------------------------------------- */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; scroll-padding-top: 90px; }\nbody { margin: 0; font: 400 17px/1.6 var(--font); color: var(--midnight); background: var(--white); -webkit-font-smoothing: antialiased; }\nimg, svg { display: block; max-width: 100%; height: auto; }\na { color: inherit; text-decoration: none; }\nbutton, input, select { font: inherit; color: inherit; }\nh1, h2, h3, p, ul, ol, figure, blockquote, dl, dd { margin: 0; }\nul, ol { padding: 0; list-style: none; }\n.wrap { width: var(--wrap); margin-inline: auto; }\n.skip { position: fixed; left: -999px; top: 12px; z-index: 200; padding: 10px 16px; border-radius: 99px; background: var(--cream); }\n.skip:focus { left: 12px; }\n:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 8px; }\n.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n.section { padding: 120px 0; }\n.section--white { background: var(--white); }\n.section--paper { background: var(--paper); }\n.section--dark { background: var(--midnight); color: var(--white); }\n.section--royal { background: linear-gradient(165deg, var(--royal), var(--navy) 60%, var(--midnight)); color: var(--white); }\n\n/* 3. Type and buttons -------------------------------------------------- */\n.label { font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--royal); }\n.label--light, .section--dark .label, .section--royal .label { color: var(--sky); }\n.h1 { font-size: clamp(42px, 5.6vw, 80px); line-height: 1.02; font-weight: 800; letter-spacing: -.035em; }\n.h2 { font-size: clamp(34px, 4.2vw, 58px); line-height: 1.05; font-weight: 750; letter-spacing: -.03em; }\n.h1 em, .h2 em { font-family: var(--serif); font-style: italic; font-weight: 300; letter-spacing: -.02em; color: var(--royal); }\n.section--dark .h2 em, .section--royal .h2 em, .hero .h1 em, .phero .h1 em { color: var(--cream); }\n.lead { margin-top: 18px; max-width: 56ch; font-size: 18.5px; color: var(--ink-soft); }\n.section--dark .lead, .section--royal .lead { color: var(--mist); }\n.head { max-width: 760px; margin-bottom: 56px; }\n.head .h2 { margin-top: 14px; }\n\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 24px; border: 0; border-radius: 99px; font-weight: 600; font-size: 15.5px; cursor: pointer; white-space: nowrap; transition: transform .25s var(--ease), background .25s, box-shadow .25s; }\n.btn:active { transform: scale(.97); }\n.btn--primary { background: var(--cream); color: var(--midnight); }\n.btn--primary:hover { background: var(--paper); box-shadow: 0 10px 30px -10px rgb(226 226 182 / .6); }\n.btn--ghost { color: var(--white); box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .28); }\n.btn--ghost:hover { box-shadow: inset 0 0 0 1.5px var(--sky); }\n.btn--sm { min-height: 42px; padding: 0 18px; font-size: 14.5px; }\n.btn--block { width: 100%; }\n.arr { transition: transform .3s var(--ease); }\na:hover > .arr, button:hover > .arr { transform: translateX(4px); }\n\n/* 4. Nav --------------------------------------------------------------- */\n.nav { position: fixed; inset: 0 0 auto; z-index: 100; padding-top: 12px; }\n.nav__bar { display: flex; align-items: center; gap: 24px; height: 62px; padding: 0 8px 0 22px; border-radius: 99px; transition: background .3s, box-shadow .3s; }\n.nav.is-scrolled .nav__bar { background: rgb(2 21 38 / .82); backdrop-filter: blur(14px); box-shadow: 0 16px 40px -24px rgb(0 0 0 / .6); }\n.logo { font-size: 22px; font-weight: 800; letter-spacing: -.03em; color: var(--white); }\n.logo i { color: var(--sky); font-style: normal; }\n.nav__links { display: flex; gap: 4px; margin-left: auto; }\n.nav__links a { padding: 8px 14px; border-radius: 99px; font-size: 15px; color: var(--mist); transition: color .2s, background .2s; }\n.nav__links a:hover { color: var(--white); background: rgb(255 255 255 / .06); }\n.nav__menu { display: none; position: relative; width: 44px; height: 44px; margin-left: auto; border: 0; border-radius: 50%; background: rgb(255 255 255 / .08); cursor: pointer; }\n.nav__menu span { position: absolute; left: 13px; right: 13px; height: 1.5px; background: var(--white); transition: transform .3s var(--ease); }\n.nav__menu span:first-child { top: 18px; } .nav__menu span:last-child { top: 25px; }\n.nav__menu[aria-expanded=\"true\"] span:first-child { transform: translateY(3.5px) rotate(45deg); }\n.nav__menu[aria-expanded=\"true\"] span:last-child { transform: translateY(-3.5px) rotate(-45deg); }\n.sheet { margin: 8px 12px 0; padding: 20px 22px 22px; border-radius: 24px; background: var(--midnight); color: var(--white); display: flex; flex-direction: column; max-height: calc(100svh - 100px); overflow: auto; }\n.sheet[hidden] { display: none; }\n.sheet a:not(.btn) { padding: 12px 0; font-size: 22px; font-weight: 700; border-bottom: 1px solid var(--line-dark); }\n.sheet .sheet__sub { font-size: 17px; font-weight: 500; color: var(--mist); }\n.sheet .label { margin-bottom: 4px; }\n.sheet .btn { margin-top: 18px; }\n\n/* 5. Hero -------------------------------------------------------------- */\n.hero { position: relative; overflow: hidden; padding: 140px 0 48px; color: var(--white); background:\n    radial-gradient(60% 60% at 80% 30%, rgb(3 52 110 / .9), transparent 70%),\n    radial-gradient(40% 50% at 0% 100%, rgb(110 172 218 / .16), transparent 70%),\n    var(--midnight); }\n.hero__grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: center; }\n.hero .h1 { margin-top: 18px; }\n.hero__lead { margin-top: 24px; max-width: 52ch; font-size: 19px; color: var(--mist); }\n.hero__ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }\n.hero__media { position: relative; justify-self: end; width: min(100%, 420px); }\n.hero__photo { aspect-ratio: 4 / 5; overflow: hidden; border-radius: 220px 220px 28px 28px; box-shadow: 0 40px 80px -40px rgb(0 0 0 / .8); }\n.hero__photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }\n.hero__chip { position: absolute; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; background: var(--white); color: var(--midnight); box-shadow: var(--shadow); animation: float 6s ease-in-out infinite; }\n.hero__chip small { display: block; font-size: 12px; color: var(--ink-soft); }\n.hero__chip b { font-size: 17px; }\n.hero__chip--1 { left: -48px; top: 22%; }\n.hero__chip--2 { right: -24px; bottom: 12%; animation-delay: -3s; background: var(--sky-light); }\n.clients { margin-top: 72px; padding-top: 28px; border-top: 1px solid var(--line-dark); display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }\n.clients__list { display: flex; flex-wrap: wrap; gap: 12px 40px; }\n.clients__list li { font: 400 22px var(--serif); color: var(--mist); transition: color .2s; }\n.clients__list li:hover { color: var(--white); }\n\n/* 6. Problem ----------------------------------------------------------- */\n.problem { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 120px 24px; }\n.pcard { position: relative; padding: 24px; border-radius: 20px; background: var(--white); box-shadow: var(--shadow); }\n.pcard:nth-child(2), .pcard:nth-child(6) { background: linear-gradient(160deg, var(--sky-light), #b9d6ee); }\n.pcard:nth-child(4) { background: linear-gradient(160deg, var(--paper), var(--cream)); }\n.pcard__tag { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--royal); }\n.pcard h3 { margin-top: 10px; font-size: 21px; line-height: 1.2; letter-spacing: -.02em; }\n.pcard p:last-child { margin-top: 6px; font-size: 15px; color: var(--ink-soft); }\n/* dashed connectors from each card to the hub, drawn in when the grid scrolls into view */\n.pcard::after { content: \"\"; position: absolute; left: 50%; height: 60px; border-left: 1.5px dashed rgb(3 52 110 / .35); transform: scaleY(0); transition: transform .6s var(--ease) .4s; }\n.pcard:nth-child(-n+3)::after { top: 100%; transform-origin: top; }\n.pcard:nth-child(n+4)::after { bottom: 100%; transform-origin: bottom; }\n.problem__hub { position: absolute; left: 0; right: 0; top: 50%; height: 0; border-top: 1.5px dashed rgb(3 52 110 / .35); display: grid; place-items: center; transform: scaleX(0); transition: transform .8s var(--ease) .7s; }\n.problem__hub span { padding: 10px 18px; border-radius: 99px; background: var(--midnight); color: var(--white); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }\n.problem.is-in .pcard::after { transform: scaleY(1); }\n.problem.is-in .problem__hub { transform: scaleX(1); }\n\n/* 7. Services ---------------------------------------------------------- */\n.services { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }\n.svc { display: flex; flex-direction: column; padding: 24px; border-radius: 28px; background: var(--navy-deep); border: 1px soli x); transition-delay: 0s; }\n.svc:hover .a2 { transform: translate(-4px, -6px); transition-delay: 0s; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }\n  .js [data-reveal], .js .pcard, .js .process li, .js [data-inview] .a1, .js [data-inview] .a2, .js [data-inview] .lead-row, .js [data-inview] .faces i, .js [data-inview] .ig__grid i { opacity: 1 !important; transform: none !important; }\n}\n\n/* Responsive ------------------------------------------------------------ */\n@media (max-width: 1080px) {\n  .nav__links { display: none; }\n  .nav__cta { margin-left: auto; }\n  .hero__grid, .phero__grid, .founder, .faq, .book, .steps-wrap { grid-template-columns: 1fr; }\n  .hero__media { justify-self: center; }\n  .founder__photo, .steps-side { position: relative; top: 0; max-width: 520px; }\n  .cases { grid-template-columns: 1fr 1fr; }\n  .process { grid-template-columns: 1fr 1fr; row-gap: 40px; }\n  .process::before { display: none; }\n  .flow__track { grid-template-columns: repeat(3, 1fr); row-gap: 24px; }\n}\n@media (max-width: 760px) {\n  body { font-size: 16.5px; }\n  .section { padding: 88px 0; }\n  .head { margin-bottom: 40px; }\n  .nav__cta { display: none; }\n  .nav__menu { display: block; }\n  .hero { padding-top: 116px; }\n  .hero__media { width: min(100%, 320px); margin-top: 8px; }\n  .hero__chip { padding: 10px 12px; } .hero__chip b { font-size: 15px; }\n  .hero__chip--1 { left: -16px; } .hero__chip--2 { right: -10px; }\n  .hero__ctas .btn { width: 100%; }\n  .clients { gap: 14px; margin-top: 56px; } .clients__list { gap: 8px 24px; } .clients__list li { font-size: 19px; }\n  .problem { grid-template-columns: 1fr; gap: 12px; }\n  .pcard::after, .problem__hub { display: none; }\n  .services, .quotes, .who, .gets, .numbers, .xlinks, .cases, .process, .foot__top { grid-template-columns: 1fr; }\n  .svc { padding: 16px; } .svc--cta { padding: 32px 24px; }\n  .art { height: 240px; }\n  .svc__num { font-size: 44px; }\n  .svc__list { grid-template-columns: 1fr; }\n  .case { min-height: 0; }\n  .form { padding: 20px; }\n  .flow__track { grid-template-columns: 1fr 1fr; }\n  .founder__photo figcaption { margin: -70px 12px 0; }\n}\n\n/* Compact sizes so every illustration fits its panel */\n.ig__grid i { aspect-ratio: 4 / 3; }\n.mini--profile, .mini--creators { padding: 14px 16px; }\n.faces { margin: 2px 0 8px; }\n.faces i { width: 36px; height: 36px; }\n.mini__big { font-size: 21px; }\n.art--gtm .chip { top: 7%; bottom: auto; }\n.art--social .chip { top: auto; bottom: 7%; right: auto; left: 6%; }\n.spark { bottom: 3%; }\n<\/style>\n<script>document.documentElement.classList.add('js')<\/script>\n<\/head>\n<body>\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n<header class=\"nav\" data-nav>\n  <div class=\"wrap nav__bar\">\n    <a class=\"logo\" href=\"index.html\" aria-label=\"Kreatify home\">Kreatify<i>.<\/i><\/a>\n    <nav class=\"nav__links\" aria-label=\"Main\"><a href=\"index.html#services\">Services<\/a><a href=\"index.html#work\">Work<\/a><a href=\"index.html#founder\">Founder<\/a><a href=\"index.html#faq\">FAQ<\/a><\/nav>\n    <a class=\"btn btn--primary btn--sm nav__cta\" href=\"index.html#book\">Book a call <span class=\"arr\" aria-hidden=\"true\">\u2192<\/span><\/a>\n    <button class=\"nav__menu\" type=\"button\" aria-expanded=\"false\" aria-controls=\"sheet\" aria-label=\"Open menu\"><span><\/span><span><\/span><\/button>\n  <\/div>\n  <div class=\"sheet\" id=\"sheet\" hidden>\n    <p class=\"label\">Services<\/p><a class=\"sheet__sub\" href=\"personal-branding.html\">Personal branding<\/a><a class=\"sheet__sub\" href=\"business-development.html\">0 to 1 brand building<\/a><a class=\"sheet__sub\" href=\"gtm-engineering.html\">GTM engineering<\/a><a class=\"sheet__sub\" href=\"social-media.html\">Social media management<\/a><a class=\"sheet__sub\" href=\"influencer-marketing.html\">Influencer marketing<\/a>\n    <a href=\"index.html#services\">Services<\/a><a href=\"index.html#work\">Work<\/a><a href=\"index.html#founder\">Founder<\/a><a href=\"index.html#faq\">FAQ<\/a>\n    <a class=\"btn btn--primary\" href=\"index.html#book\">Book a call <span class=\"arr\" aria-hidden=\"true\">\u2192<\/span><\/a>\n  <\/div>\n<\/header>\n<main id=\"main\">\n<section class=\"phero\">\n  <div class=\"wrap phero__grid\">\n    <div>\n      <p class=\"crumb rise\" style=\"--i:0\"><a href=\"index.html#services\">Services<\/a> / GTM engineering for founders<\/p>\n      <h1 class=\"h1 rise\" style=\"--i:1\">More meetings, <em>less chasing.<\/em><\/h1>\n      <p class=\"hero__lead rise\" style=\"--i:2\">GTM means go-to-market: how you find buyers and start conversations. We build that system for you and run it every week. Every tool sits on your own accounts.<\/p>\n      <div class=\"hero__ctas rise\" style=\"--i:3\"><a class=\"btn btn--primary\" href=\"index.html#book\">Book a call with Krish <span class=\"arr\" aria-hidden=\"true\">\u2192<\/span><\/a><a class=\"btn btn--ghost\" href=\"#how\">How it works<\/a><\/div>\n    <\/div>\n    <div class=\"phero__art rise\" style=\"--i:2\" data-inview><div class=\"art art--gtm\" aria-hidden=\"true\">\n      <div class=\"mini mini--leads a1\">\n        <p class=\"mini__label\">Buyers worth talking to<\/p>\n        <div class=\"lead-row\"><i>SL<\/i><span><b>Saffron Labs<\/b><small>Hired a VP Sales<\/small><\/span><em class=\"pill pill--done\">Meeting booked<\/em><\/div>\n        <div class=\"lead-row\"><i>NB<\/i><span><b>Northbay<\/b><small>Visited your site<\/small><\/span><em class=\"pill pill--mid\">Replied<\/em><\/div>\n        <div class=\"lead-row\"><i>VR<\/i><span><b>Verve Retail<\/b><small>Raised a seed round<\/small><\/span><em class=\"pill\">Message sent<\/em><\/div>\n      <\/div>\n      <div class=\"chip chip--cream a2\">Thu 4:30 pm \u00b7 call booked<\/div>\n    <\/div><\/div>\n  <\/div>\n<\/section>\n<section class=\"section section--white\">\n  <div class=\"wrap\">\n    <div class=\"head\" data-reveal>\n      <p class=\"label\">Who it is for<\/p>\n      <h2 class=\"h2\">GTM in plain words: <em>find, reach, follow up.<\/em><\/h2>\n      \n    <\/div>\n    <ul class=\"who\"><li data-reveal style=\"--d:0ms\"><span class=\"who__icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/><\/svg><\/span><h3>Find<\/h3><p>We watch for signs a company needs you: a new hire, a funding round, a comment on your post.<\/p><\/li><li data-reveal style=\"--d:80ms\"><span class=\"who__icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"/><\/svg><\/span><h3>Reach<\/h3><p>The right person gets a short, relevant message by email or LinkedIn, written in your voice.<\/p><\/li><li data-reveal style=\"--d:160ms\"><span class=\"who__icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg><\/span><h3>Follow up<\/h3><p>Replies are answered within minutes and meetings land on your calendar, logged in your CRM.<\/p><\/li><\/ul>\n  <\/div>\n<\/section>\n<section class=\"section section--paper\" id=\"how\">\n  <div class=\"wrap steps-wrap\">\n    <div class=\"steps-side\"><div class=\"head\" data-reveal>\n      <p class=\"label\">How it works<\/p>\n      <h2 class=\"h2\">From a buyer list <em>to booked calls.<\/em><\/h2>\n      <p class=\"lead\">Set up once, improved every week. You approve every message before it goes out.<\/p>\n    <\/div><\/div>\n    <ol class=\"steps\"><li class=\"step\" data-step><span class=\"step__n\">01<\/span><div><h3>Define your ideal buyer<\/h3><p>Which companies, which roles, and what tells us they might need you now.<\/p><small>Week 1<\/small><\/div><\/li><li class=\"step\" data-step><span class=\"step__n\">02<\/span><div><h3>Build the list<\/h3><p>Around 100 target companies, researched, with the right person at each.<\/p><small>Weeks 1 to 2<\/small><\/div><\/li><li class=\"step\" data-step><span class=\"step__n\">03<\/span><div><h3>Set up sending properly<\/h3><p>A separate domain and inboxes, warmed up so messages land in the main inbox.<\/p><small>Weeks 1 to 4<\/small><\/div><\/li><li class=\"step\" data-step><span class=\"step__n\">04<\/span><div><h3>Launch outreach<\/h3><p>Email and LinkedIn messages that start when a signal appears.<\/p><small>From week 4<\/small><\/div><\/li><li class=\"step\" data-step><span class=\"step__n\">05<\/span><div><h3>Replies and booking<\/h3><p>Every reply is answered within minutes. Interested buyers get a booking link.<\/p><small>From week 5<\/small><\/div><\/li><li class=\"step\" data-step><span class=\"step__n\">06<\/span><div><h3>Improve every week<\/h3><p>We look at what got replies and adjust the list and the messages.<\/p><small>Every Monday<\/small><\/div><\/li><\/ol>\n  <\/div>\n<\/section>\n<section class=\"section section--white\" id=\"tools\">\n  <div class=\"wrap\">\n    <div class=\"head\" data-reveal>\n      <p class=\"label\">The tools<\/p>\n      <h2 class=\"h2\">33 tools, <em>set up in your name.<\/em><\/h2>\n      <p class=\"lead\">We only use what your buyers need, set up on your own accounts. If we ever stop working together, everything keeps running.<\/p>\n    <\/div>\n    <div class=\"filters\" role=\"group\" aria-label=\"Filter tools\" data-reveal><button type=\"button\" class=\"filter is-on\" data-filter=\"all\" aria-pressed=\"true\">All<\/button><button type=\"button\" class=\"filter\" data-filter=\"sig\" aria-pressed=\"false\">Signals and data<\/button><button type=\"button\" class=\"filter\" data-filter=\"out\" aria-pressed=\"false\">Outreach<\/button><button type=\"button\" class=\"filter\" data-filter=\"auto\" aria-pressed=\"false\">Automation<\/button><button type=\"button\" class=\"filter\" data-filter=\"ai\" aria-pressed=\"false\">AI<\/button><button type=\"butto d\" data-reveal>\n      <p class=\"label\">What you get<\/p>\n      <h2 class=\"h2\">A sales system <em>that runs every week.<\/em><\/h2>\n      \n    <\/div>\n    <ul class=\"gets\"><li data-reveal style=\"--d:0ms\"><h3>Ideal buyer profile<\/h3><p>Who to target, and why, written down.<\/p><\/li><li data-reveal style=\"--d:60ms\"><h3>100-company list<\/h3><p>Researched, with the right person at each.<\/p><\/li><li data-reveal style=\"--d:120ms\"><h3>Sending set-up<\/h3><p>Domain, inboxes and warm-up done properly.<\/p><\/li><li data-reveal style=\"--d:180ms\"><h3>Outreach sequences<\/h3><p>Email and LinkedIn, triggered by real signals.<\/p><\/li><li data-reveal style=\"--d:240ms\"><h3>Fast replies<\/h3><p>AI drafts answers in seconds, a person checks them.<\/p><\/li><li data-reveal style=\"--d:300ms\"><h3>CRM you own<\/h3><p>Every conversation logged in one place.<\/p><\/li><\/ul>\n  <\/div>\n<\/section>\n<section class=\"section section--white\">\n  <div class=\"wrap\">\n    <div class=\"head\" data-reveal>\n      <p class=\"label\">What to expect<\/p>\n      <h2 class=\"h2\">The numbers <em>we work towards.<\/em><\/h2>\n      <p class=\"lead\">These are targets we plan around, not promises. Your Monday report shows where you are against them.<\/p>\n    <\/div>\n    <ul class=\"numbers\"><li data-reveal style=\"--d:0ms\"><b>5 to 15<\/b><span>qualified meetings a month by weeks 9 to 12<\/span><\/li><li data-reveal style=\"--d:80ms\"><b>Under 1 min<\/b><span>from a new enquiry to a first reply<\/span><\/li><li data-reveal style=\"--d:160ms\"><b>100<\/b><span>target companies in the first list<\/span><\/li><\/ul>\n  <\/div>\n<\/section>\n<section class=\"section section--paper\" id=\"faq\">\n  <div class=\"wrap faq\">\n    <div class=\"head\" data-reveal>\n      <p class=\"label\">FAQ<\/p>\n      <h2 class=\"h2\">Questions about <em>gtm engineering for founders.<\/em><\/h2>\n      \n    <\/div>\n    <div class=\"faq__list\" data-reveal><details open><summary>Will this spam people?<span class=\"plus\" aria-hidden=\"true\"><\/span><\/summary><p>No. We send small volumes to carefully chosen people, with messages written for them.<\/p><\/details><details><summary>Do I need to buy the tools?<span class=\"plus\" aria-hidden=\"true\"><\/span><\/summary><p>Some, on your own accounts. We tell you exactly which ones you need and which to skip.<\/p><\/details><details><summary>How soon do meetings start?<span class=\"plus\" aria-hidden=\"true\"><\/span><\/summary><p>Usually between weeks five and eight, once sending is warmed up and outreach is live.<\/p><\/details><\/div>\n  <\/div>\n<\/section>\n<section class=\"section section--royal\">\n  <div class=\"wrap\">\n    <div class=\"head\" data-reveal>\n      <p class=\"label\">Next step<\/p>\n      <h2 class=\"h2\">Talk it through <em>with Krish.<\/em><\/h2>\n      <p class=\"lead\">A 30-minute call. We look at where your business is today and tell you honestly what would help most.<\/p>\n    <\/div>\n    <div class=\"hero__ctas\" data-reveal><a class=\"btn btn--primary\" href=\"index.html#book\">Book a 30-minute call <span class=\"arr\" aria-hidden=\"true\">\u2192<\/span><\/a><a class=\"btn btn--ghost\" href=\"https://wa.me/918377916115\">WhatsApp Krish<\/a><\/div>\n    <p class=\"label label--light xlinks__label\">Other services<\/p>\n    <div class=\"xlinks\"><a class=\"xlink\" href=\"personal-branding.html\"><b>Personal branding<\/b><span>We turn the founder into the face buyers trust, on LinkedIn, in their own voice.<\/span><span class=\"arr\" aria-hidden=\"true\">\u2192<\/span><\/a><a class=\"xlink\" href=\"business-development.html\"><b>0 to 1 brand building<\/b><span>From an idea to a registered brand with a clear offer and its first clients.<\/span><span class=\"arr\" aria-hidden=\"true\">\u2192<\/span><\/a><a class=\"xlink\" href=\"social-media.html\"><b>Social media management<\/b><span>We start and run your Instagram and other channels, from the first post to a feed people follo  b.setAttribute('aria-pressed', String(on)); });\n    $$('[data-tools] .tool').forEach((t) => t.classList.toggle('is-dim', group !== 'all' && t.dataset.group !== group));\n  }));\n\n  /* One lead through the system: steps light up in turn while visible ------- */\n  const flow = $('[data-flow]');\n  if (flow) {\n    const items = $$('.flow__track li', flow);\n    let index = -1, timer = null;\n    const show = (k) => items.forEach((li, j) => { li.classList.toggle('is-on', j <= k); li.classList.toggle('is-now', j === k); });\n    const next = () => { index = (index + 1) % items.length; show(index); timer = setTimeout(next, index === items.length - 1 ? 2800 : 1300); };\n    if (reduceMotion) show(items.length - 1);\n    else new IntersectionObserver(([entry]) => {\n      if (entry.isIntersecting && !timer) next();\n      if (!entry.isIntersecting) { clearTimeout(timer); timer = null; }\n    }, { threshold: 0.4 }).observe(flow);\n  }\n\n  /* Booking form: checks the fields, then opens WhatsApp with the answers --- */\n  const form = $('[data-form]');\n  if (form) {\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      let firstBad = null;\n      [['#f-name', '#e-name'], ['#f-co', '#e-co']].forEach(([input, error]) => {\n        const field = $(input, form), bad = !field.value.trim();\n        field.setAttribute('aria-invalid', String(bad));\n        $(error, form).hidden = !bad;\n        if (bad && !firstBad) firstBad = field;\n      });\n      if (firstBad) { firstBad.focus(); return; }\n      const data = new FormData(form);\n      const message = [\n        \"Hi Krish, I'd like to book a call.\",\n        `Name: ${data.get('name').trim()}`,\n        `Business: ${data.get('company').trim()}`,\n        `Stage: ${data.get('stage')}`,\n        `Looking for: ${data.get('service')}`,\n      ].join('\\n');\n      window.open(`https://wa.me/${form.dataset.wa}?text=${encodeURIComponent(message)}`, '_blank', 'noopener');\n    });\n  }\n})();\n<\/scri =================================================== */\n\n/* 1. Tokens ----------------------------------------------------------- */\n:root {\n  --midnight: #021526;\n  --navy: #0a2744;\n  --navy-deep: #031b31;\n  --royal: #03346e;\n  --sky: #6eacda;\n  --sky-light: #e4eef6;\n  --cream: #e2e2b6;\n  --paper: #f2f1e4;\n  --white: #ffffff;\n  --mist: #b6c5d6;\n  --ink-soft: #3a5f86;\n\n  --font: \"Archivo\", system-ui, sans-serif;\n  --serif: \"Fraunces\", Georgia, serif;\n\n  --wrap: min(100% - 40px, 1200px);\n  --radius: 24px;\n  --ease: cubic-bezier(.16, 1, .3, 1);\n  --line-dark: rgb(110 172 218 / .16);\n  --line-light: rgb(3 52 110 / .12);\n  --shadow: 0 24px 60px -30px rgb(2 21 38 / .45);\n}\n\n/* 2. Base ------------------------------------------------------------- */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; scroll-padding-top: 90px; }\nbody { margin: 0; font: 400 17px/1.6 var(--font); color: var(--midnight); background: var(--white); -webkit-font-smoothing: antialiased; }\nimg, svg { display: block; max-width: 100%; height: auto; }\na { color: inherit; text-decoration: none; }\nbutton, input, select { font: inherit; color: inherit; }\nh1, h2, h3, p, ul, ol, figure, blockquote, dl, dd { margin: 0; }\nul, ol { padding: 0; list-style: none; }\n.wrap { width: var(--wrap); margin-inline: auto; }\n.skip { position: fixed; left: -999px; top: 12px; z-index: 200; padding: 10px 16px; border-radius: 99px; background: var(--cream); }\n.skip:focus { left: 12px; }\n:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 8px; }\n.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n.section { padding: 120px 0; }\n.section--white { background: var(--white); }\n.section--paper { background: var(--paper); }\n.section--dark { background: var(--midnight); color: var(--white); }\n.section--royal { background: linear-gradient(165deg, var(--royal), var(--navy) 60%, var(--midnight)); color: var(--white); }\n\n/* 3. Type and buttons -------------------------------------------------- */\n.label { font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--royal); }\n.label--light, .section--dark .label, .section--royal .label { color: var(--sky); }\n.h1 { font-size: clamp(42px, 5.6vw, 80px); line-height: 1.02; font-weight: 800; letter-spacing: -.035em; }\n.h2 { font-size: clamp(34px, 4.2vw, 58px); line-height: 1.05; font-weight: 750; letter-spacing: -.03em; }\n.h1 em, .h2 em { font-family: var(--serif); font-style: italic; font-weight: 300; letter-spacing: -.02em; color: var(--royal); }\n.section--dark .h2 em, .section--royal .h2 em, .hero .h1 em, .phero .h1 em { color: var(--cream); }\n.lead { margin-top: 18px; max-width: 56ch; font-size: 18.5px; color: var(--ink-soft); }\n.section--dark .lead, .section--royal .lead { color: var(--mist); }\n.head { max-width: 760px; margin-bottom: 56px; }\n.head .h2 { margin-top: 14px; }\n\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 24px; border: 0; border-radius: 99px; font-weight: 600; font-size: 15.5px; cursor: pointer; white-space: nowrap; transition: transform .25s var(--ease), background .25s, box-shadow .25s; }\n.btn:active { transform: scale(.97); }\n.btn--primary { background: var(--cream); color: var(--midnight); }\n.btn--primary:hover { background: var(--paper); box-shadow: 0 10px 30px -10px rgb(226 226 182 / .6); }\n.btn--ghost { color: var(--white); box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .28); }\n.btn--ghost:hover { box-shadow: inset 0 0 0 1.5px var(--sky); }\n.btn--sm { min-height: 42px; padding: 0 18px; font-size: 14.5px; }\n.btn--block { width: 100%; }\n.arr { transition: transform .3s var(--ease); }\na:hover > .arr, button:hover > .arr { transform: translateX(4px); }\n\n/* 4. Nav ------------------------------------------ x 24px; }\n.pcard { position: relative; padding: 24px; border-radius: 20px; background: var(--white); box-shadow: var(--shadow); }\n.pcard:nth-child(2), .pcard:nth-child(6) { background: linear-gradient(160deg, var(--sky-light), #b9d6ee); }\n.pcard:nth-child(4) { background: linear-gradient(160deg, var(--paper), var(--cream)); }\n.pcard__tag { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--royal); }\n.pcard h3 { margin-top: 10px; font-size: 21px; line-height: 1.2; letter-spacing: -.02em; }\n.pcard p:last-child { margin-top: 6px; font-size: 15px; color: var(--ink-soft); }\n/* dashed connectors from each card to the hub, drawn in when the grid scrolls into view */\n.pcard::after { content: \"\"; position: absolute; left: 50%; height: 60px; border-left: 1.5px dashed rgb(3 52 110 / .35); transform: scaleY(0); transition: transform .6s var(--ease) .4s; }\n.pcard:nth-child(-n+3)::after { top: 100%; transform-origin: top; }\n.pcard:nth-child(n+4)::after { bottom: 100%; transform-origin: bottom; }\n.problem__hub { position: absolute; left: 0; right: 0; top: 50%; height: 0; border-top: 1.5px dashed rgb(3 52 110 / .35); display: grid; place-items: center; transform: scaleX(0); transition: transform .8s var(--ease) .7s; }\n.problem__hub span { padding: 10px 18px; border-radius: 99px; background: var(--midnight); color: var(--white); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }\n.problem.is-in .pcard::after { transform: scaleY(1); }\n.problem.is-in .problem__hub { transform: scaleX(1); }\n\n/* 7. Services ---------------------------------------------------------- */\n.services { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }\n.svc { display: flex; flex-direction: column; padding: 24px; border-radius: 28px; background: var(--navy-deep); border: 1px solid var(--line-dark); transition: border-color .3s, transform .4s var(--ease); }\n.svc:hover { border-color: rgb(110 172
